<!doctype html>
<!--
  Placeholder frontend for the Tauri bundle.

  The real UI is the repo-root index.html, which is served by a local static
  HTTP server (python -m http.server 8000) spawned from src-tauri/src/lib.rs.
  The webview is pointed at http://localhost:8000 at runtime, NOT at these
  bundled assets. Tauri still requires `build.frontendDist` to resolve to a
  directory containing an index.html, so this minimal page exists only to
  satisfy that requirement and to show something if the window is ever pointed
  here directly.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ollama Voice Assistant by Olio Solutions</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: #e7e7ea;
        color: #1e293b;
      }
      .msg { text-align: center; }
      .accent { color: #6366f1; }
    </style>
  </head>
  <body>
    <div class="msg">
      <h1>Ollama Voice Assistant</h1>
      <p>Starting the local voice pipeline<span class="accent">…</span></p>
    </div>
  </body>
</html>
