[project]
name = "ollama-voice-assistant"
version = "0.1.0"
description = "Open-source voice assistant - local ASR + TTS with the LLM on Ollama Cloud."
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "numpy",
    "soxr",
    "fastapi",
    "openai",
    "uvicorn",
    "pip",
    "pocket-tts",
]

[project.optional-dependencies]
# Torch / CUDA backend
cuda = [
    "torch",
    "torchaudio",
    "nemo-toolkit[asr]",
    "cuda-python",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ova*"]
exclude = ["profiles*"]
